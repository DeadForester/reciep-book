services:
  mongo:
    image: mongo:latest
    container_name: recipe-mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: recipe_db
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:latest
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: bestuser
      MINIO_ROOT_PASSWORD: bestuser
    volumes:
      - minio_data:/data
    restart: unless-stopped
    command: server /data --console-address ":9001"

volumes:
  mongo_data:
  minio_data:
