version: '3.8'
services:
  backend:
    build:
      context: ./backend/recipe-service
      dockerfile: Dockerfile
    image: recipe-book-backend:latest
    container_name: recipe-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin@mongo:27017/recipe_db?authSource=admin
      APP_MINIO_URL: http://minio:9000
      APP_MINIO_ACCESS_KEY: bestuser
      APP_MINIO_SECRET_KEY: bestuser
      APP_IMAGE_PROXY_PATH: /images/
    depends_on:
      - mongo
      - minio

  frontend:
    build:
      context: ./frontend/recipe
      dockerfile: Dockerfile
    image: recipe-book-frontend:latest
    container_name: recipe-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  mongo:
    image: mongo:latest
    container_name: recipe-mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: recipe_db
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: recipe-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: bestuser
      MINIO_ROOT_PASSWORD: bestuser
    volumes:
      - minio_data:/data
      - ./minio-init.sh:/docker-entrypoint-initdb.d/minio-init.sh
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-u", "bestuser:bestuser", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo_data:
  minio_data:
