name: Telegram Notify
description: Send GitHub Actions notification to Telegram

inputs:
  job-name:
    description: Name of the completed job
    required: true

  status:
    description: Job status
    required: true

runs:
  using: composite

  steps:
    - name: Send Telegram notification
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ env.TELEGRAM_CHAT_ID }}
        JOB_NAME: ${{ inputs.job-name }}
        JOB_STATUS: ${{ inputs.status }}

      run: |
        case "$JOB_STATUS" in
          success)
            ICON="✅"
            TEXT="SUCCESS"
            ;;
          failure)
            ICON="❌"
            TEXT="FAILED"
            ;;
          cancelled)
            ICON="⛔"
            TEXT="CANCELLED"
            ;;
          skipped)
            ICON="⏭️"
            TEXT="SKIPPED"
            ;;
          *)
            ICON="❓"
            TEXT="$JOB_STATUS"
            ;;
        esac

        MESSAGE=$(cat <<EOF
        🚀 GitHub Actions

        ${ICON} ${JOB_NAME}

        Status: ${TEXT}

        📦 Repository:
        ${GITHUB_REPOSITORY}

        🌿 Branch:
        ${GITHUB_REF_NAME}

        👤 Author:
        ${GITHUB_ACTOR}

        🔑 Commit:
        ${GITHUB_SHA}

        🔗 https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
        EOF
        )

        curl -s \
          -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          --data-urlencode text="$MESSAGE"