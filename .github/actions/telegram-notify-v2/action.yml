name: Telegram Notify
description: Send GitHub Actions notification to Telegram

inputs:
  job-name:
    required: true
  status:
    required: true
  telegram-token:
    required: true
  telegram-chat-id:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        JOB_NAME: ${{ inputs.job-name }}
        JOB_STATUS: ${{ inputs.status }}
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram-token }}
        TELEGRAM_CHAT_ID: ${{ inputs.telegram-chat-id }}

      run: |
        escape_html() {
          local s="$1"
          s="${s//&/&amp;}"
          s="${s//</&lt;}"
          s="${s//>/&gt;}"
          echo "$s"
        }

        case "${{ inputs.status }}" in
          success)   ICON="✅"; TEXT="SUCCESS" ;;
          failure)   ICON="❌"; TEXT="FAILED" ;;
          cancelled) ICON="⛔"; TEXT="CANCELLED" ;;
          skipped)   ICON="⏭"; TEXT="SKIPPED" ;;
          *)         ICON="❓"; TEXT="${{ inputs.status }}" ;;
        esac
        
        COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "Неизвестно")
        COMMIT_MSG="${COMMIT_MSG:0:100}"
        
        COMMIT_MSG=$(escape_html "$COMMIT_MSG")
        WORKFLOW_NAME=$(escape_html "${GITHUB_WORKFLOW}")
        REPO_NAME=$(escape_html "${GITHUB_REPOSITORY}")
        BRANCH_NAME=$(escape_html "${GITHUB_REF_NAME}")
        EVENT_NAME=$(escape_html "${GITHUB_EVENT_NAME}")
        ACTOR_NAME=$(escape_html "${GITHUB_ACTOR}")
        JOB_NAME_ESC=$(escape_html "${JOB_NAME}")
        
        SHORT_SHA="${GITHUB_SHA:0:7}"
        
        JOB_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/job/${GITHUB_JOB}"
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        
        MESSAGE="🚀 <b>GitHub Actions</b>"
        MESSAGE="${MESSAGE}\n\n${ICON} <b>${TEXT}</b> | <code>${JOB_NAME_ESC}</code>"
        MESSAGE="${MESSAGE}\n\n🔄 <b>Workflow:</b> ${WORKFLOW_NAME}"
        MESSAGE="${MESSAGE}\n📦 <b>Repository:</b> ${REPO_NAME}"
        MESSAGE="${MESSAGE}\n🌿 <b>Branch:</b> ${BRANCH_NAME}"
        MESSAGE="${MESSAGE}\n🎯 <b>Event:</b> ${EVENT_NAME}"
        MESSAGE="${MESSAGE}\n👤 <b>Author:</b> ${ACTOR_NAME}"
        MESSAGE="${MESSAGE}\n🔑 <b>Commit:</b> <code>${SHORT_SHA}</code> - ${COMMIT_MSG}"
        MESSAGE="${MESSAGE}\n\n🔗 <a href=\"${JOB_URL}\">👁 View Job Logs</a>"
        MESSAGE="${MESSAGE}\n🔗 <a href=\"${RUN_URL}\">👁 View Workflow Run</a>"
        
        curl -s \
          -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="HTML" \
          --data-urlencode text="$(echo -e "$MESSAGE")"