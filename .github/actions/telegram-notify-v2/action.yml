name: Telegram Notify
description: Send GitHub Actions notification to Telegram

inputs:
  job-name:
    required: true

  status:
    required: true

  telegram-token:
    required: true

  telegram-chat-id:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        JOB_NAME: ${{ inputs.job-name }}
        JOB_STATUS: ${{ inputs.status }}
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram-token }}
        TELEGRAM_CHAT_ID: ${{ inputs.telegram-chat-id }}

      run: |
        echo "Token length: ${#TELEGRAM_BOT_TOKEN}"
        echo "Chat ID length: ${#TELEGRAM_CHAT_ID}"

        case "$JOB_STATUS" in
          success) ICON="✅"; TEXT="SUCCESS" ;;
          failure) ICON="❌"; TEXT="FAILED" ;;
          cancelled) ICON="⛔"; TEXT="CANCELLED" ;;
          skipped) ICON="⏭️"; TEXT="SKIPPED" ;;
          *) ICON="❓"; TEXT="$JOB_STATUS" ;;
        esac

        curl -s -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          --data-urlencode text="🚀 ${ICON} ${JOB_NAME} - ${TEXT}"