name: Telegram Notify
description: Send GitHub Actions notification to Telegram

inputs:
  job-name:
    required: true
  status:
    required: true
  telegram-token:
    required: true
  telegram-chat-id:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        JOB_NAME: ${{ inputs.job-name }}
        JOB_STATUS: ${{ inputs.status }}
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram-token }}
        TELEGRAM_CHAT_ID: ${{ inputs.telegram-chat-id }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        escape_html() {
          local s="$1"
          s="${s//&/&amp;}"
          s="${s//</&lt;}"
          s="${s//>/&gt;}"
          echo "$s"
        }

        format_duration() {
          local seconds=$1
          local hours=$((seconds / 3600))
          local minutes=$(( (seconds % 3600) / 60 ))
          local secs=$((seconds % 60))
        
          if [ $hours -gt 0 ]; then
            printf "%dh %dm %ds" $hours $minutes $secs
          elif [ $minutes -gt 0 ]; then
            printf "%dm %ds" $minutes $secs
          else
            printf "%ds" $secs
          fi
        }

        case "${{ inputs.status }}" in
          success)   ICON="✅"; TEXT="УСПЕШНО" ;;
          failure)   ICON="❌"; TEXT="ОШИБКА" ;;
          cancelled) ICON="🛑"; TEXT="ОСТАНОВЛЕНО ВРУЧНУЮ" ;;
          skipped)   ICON="⏭"; TEXT="ПРОПУЩЕНО" ;;
          *)         ICON="❓"; TEXT="${{ inputs.status }}" ;;
        esac
        
        COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "Неизвестно")
        COMMIT_MSG="${COMMIT_MSG:0:100}"
        
        COMMIT_MSG=$(escape_html "$COMMIT_MSG")
        WORKFLOW_NAME=$(escape_html "${GITHUB_WORKFLOW}")
        REPO_NAME=$(escape_html "${GITHUB_REPOSITORY}")
        BRANCH_NAME=$(escape_html "${GITHUB_REF_NAME}")
        EVENT_NAME=$(escape_html "${GITHUB_EVENT_NAME}")
        ACTOR_NAME=$(escape_html "${GITHUB_ACTOR}")
        JOB_NAME_ESC=$(escape_html "${JOB_NAME}")
        
        SHORT_SHA="${GITHUB_SHA:0:7}"
        
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        
        JOBS_JSON=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs")
        
        JOB_HTML_URL=$(echo "$JOBS_JSON" | jq -r --arg name "${GITHUB_JOB}" '.jobs[] | select(.name | startswith($name)) | .html_url' | head -n 1)
        
        DURATION=""
        if [[ "${{ inputs.status }}" == "cancelled" || "${{ inputs.status }}" == "failure" || "${{ inputs.status }}" == "success" ]]; then
          STARTED_AT=$(echo "$JOBS_JSON" | jq -r --arg name "${GITHUB_JOB}" '.jobs[] | select(.name | startswith($name)) | .started_at' | head -n 1)
          COMPLETED_AT=$(echo "$JOBS_JSON" | jq -r --arg name "${GITHUB_JOB}" '.jobs[] | select(.name | startswith($name)) | .completed_at' | head -n 1)
        
          if [ -n "$STARTED_AT" ] && [ "$STARTED_AT" != "null" ] && [ -n "$COMPLETED_AT" ] && [ "$COMPLETED_AT" != "null" ]; then
            START_TS=$(date -d "$STARTED_AT" +%s 2>/dev/null || echo "")
            END_TS=$(date -d "$COMPLETED_AT" +%s 2>/dev/null || echo "")
        
            if [ -n "$START_TS" ] && [ -n "$END_TS" ]; then
              DURATION_SEC=$((END_TS - START_TS))
              DURATION=$(format_duration $DURATION_SEC)
            fi
          fi
        fi
        
        if [ -z "$JOB_HTML_URL" ] || [ "$JOB_HTML_URL" = "null" ]; then
          JOB_HTML_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/job/${GITHUB_JOB}"
        fi
        
        MESSAGE="🚀 <b>GitHub Actions</b>"
        MESSAGE="${MESSAGE}\n\n${ICON} <b>${TEXT}</b> | <code>${JOB_NAME_ESC}</code>"
        MESSAGE="${MESSAGE}\n\n🔄 <b>Workflow:</b> ${WORKFLOW_NAME}"
        MESSAGE="${MESSAGE}\n📦 <b>Repository:</b> ${REPO_NAME}"
        MESSAGE="${MESSAGE}\n🌿 <b>Branch:</b> ${BRANCH_NAME}"
        MESSAGE="${MESSAGE}\n🎯 <b>Event:</b> ${EVENT_NAME}"
        MESSAGE="${MESSAGE}\n👤 <b>Author:</b> ${ACTOR_NAME}"
        MESSAGE="${MESSAGE}\n🔑 <b>Commit:</b> <code>${SHORT_SHA}</code> - ${COMMIT_MSG}"
        
        if [ -n "$DURATION" ]; then
          MESSAGE="${MESSAGE}\n⏱ <b>Duration:</b> ${DURATION}"
        fi
        
        MESSAGE="${MESSAGE}\n\n🔗 <a href=\"${JOB_HTML_URL}\">👁 View Job Logs</a>"
        MESSAGE="${MESSAGE}\n🔗 <a href=\"${RUN_URL}\">👁 View Workflow Run</a>"
        
        curl -s \
          -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="HTML" \
          --data-urlencode text="$(echo -e "$MESSAGE")"