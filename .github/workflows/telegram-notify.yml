name: Telegram Notifications

on:
  workflow_run:
    workflows:
      - "CI Pipeline"
      - "Backend Tests"
      - "Backend Build"
      - "Frontend Tests"
      - "Frontend Build"
      - "SonarQube Scan"
      - "Docker Backend"
      - "Docker Frontend"
    types:
      - completed

jobs:
  send-telegram-notification:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Get workflow info
        id: workflow
        run: |
          echo "name=${{ github.event.workflow_run.name }}" >> $GITHUB_OUTPUT
          echo "conclusion=${{ github.event.workflow_run.conclusion }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          echo "url=${{ github.event.workflow_run.html_url }}" >> $GITHUB_OUTPUT

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ steps.workflow.outputs.conclusion == 'success' && '✅' || '❌' }} *${{ steps.workflow.outputs.name }}*

            📦 Repository: ${{ github.repository }}
            🏷️ Branch: ${{ steps.workflow.outputs.branch }}
            📝 Commit: [${{ steps.workflow.outputs.sha }}](https://github.com/${{ github.repository }}/commit/${{ steps.workflow.outputs.sha }})
            
            ⏱️ Status: ${{ steps.workflow.outputs.conclusion == 'success' && '✅ SUCCESS' || '❌ FAILED' }}
            👤 Author: ${{ github.actor }}
            
            🔗 [View Logs](${{ steps.workflow.outputs.url }})
            
            📅 Time: ${{ github.event.workflow_run.created_at }}
            
            ${{ steps.workflow.outputs.conclusion == 'failure' && '⚠️ Please check the logs for more details!' || '' }}