name: Telegram Notifications

on:
  workflow_run:
    workflows:
      - "CI Pipeline"
      - "Backend Tests"
      - "Backend Build"
      - "Frontend Tests"
      - "Frontend Build"
      - "SonarQube Scan"
      - "Docker Backend"
      - "Docker Frontend"
    types:
      - completed

jobs:
  send-telegram-notification:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ github.event.workflow_run.conclusion == 'success' && '✅' || '❌' }} *${{ github.event.workflow_run.name }}*

            📦 Repository: ${{ github.repository }}
            🏷️ Branch: ${{ github.event.workflow_run.head_branch }}
            📝 Commit: [${{ github.event.workflow_run.head_sha }}](https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }})
            
            ⏱️ Status: ${{ github.event.workflow_run.conclusion == 'success' && '✅ SUCCESS' || '❌ FAILED' }}
            👤 Author: ${{ github.actor }}
            
            🔗 [View Logs](${{ github.event.workflow_run.html_url }})
            
            📅 Time: ${{ github.event.workflow_run.created_at }}