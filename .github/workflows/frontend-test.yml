name: Frontend Tests

on:
  workflow_call:
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true

jobs:
  test:
    name: Frontend - Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/recipe/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/recipe/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/recipe

      - name: Run frontend tests with coverage
        run: npm run test
        working-directory: frontend/recipe

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/recipe/coverage/
          retention-days: 1

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/telegram-notify-v2
        with:
          job-name: Frontend Tests
          status: ${{ job.status }}
          telegram-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}