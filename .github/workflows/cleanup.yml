name: Cleanup Old Images

on:
  workflow_call:

env:
  YC_REGISTRY_ID: crpogsfdi7ukhk7uooeg
  KEEP_IMAGES_COUNT: 3

jobs:
  cleanup:
    name: Cleanup - Old Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Setup Yandex Cloud CLI
        uses: yc-actions/yc-auth@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Cleanup Backend Images
        run: |
          echo "🧹 Очистка старых образов Backend..."
          
          IMAGES=$(yc container image list \
            --repository-name cr.yandex/${{ env.YC_REGISTRY_ID }}/recipe-backend \
            --format json)
          
          TOTAL_COUNT=$(echo "$IMAGES" | jq 'length')
          echo " Всего образов Backend: $TOTAL_COUNT"
          
          if [ "$TOTAL_COUNT" -le "${{ env.KEEP_IMAGES_COUNT }}" ]; then
            echo "✅ Образов меньше или равно ${{ env.KEEP_IMAGES_COUNT }}, удаление не требуется"
            exit 0
          fi
          
          IMAGES_TO_DELETE=$(echo "$IMAGES" | jq -r --argjson keep ${{ env.KEEP_IMAGES_COUNT }} '
            sort_by(.created_at) | 
            reverse | 
            .[$keep:] | 
            .[] | 
            .id
          ')
          
          for IMAGE_ID in $IMAGES_TO_DELETE; do
            echo "️  Удаляю образ: $IMAGE_ID"
            yc container image delete $IMAGE_ID --async || echo "⚠️  Не удалось удалить $IMAGE_ID"
          done
          
          echo "✅ Очистка Backend завершена"

      - name: Cleanup Frontend Images
        run: |
          echo "🧹 Очистка старых образов Frontend..."
          
          IMAGES=$(yc container image list \
            --repository-name cr.yandex/${{ env.YC_REGISTRY_ID }}/recipe-frontend \
            --format json)
          
          TOTAL_COUNT=$(echo "$IMAGES" | jq 'length')
          echo " Всего образов Frontend: $TOTAL_COUNT"
          
          if [ "$TOTAL_COUNT" -le "${{ env.KEEP_IMAGES_COUNT }}" ]; then
            echo "✅ Образов меньше или равно ${{ env.KEEP_IMAGES_COUNT }}, удаление не требуется"
            exit 0
          fi
          
          IMAGES_TO_DELETE=$(echo "$IMAGES" | jq -r --argjson keep ${{ env.KEEP_IMAGES_COUNT }} '
            sort_by(.created_at) | 
            reverse | 
            .[$keep:] | 
            .[] | 
            .id
          ')
          
          for IMAGE_ID in $IMAGES_TO_DELETE; do
            echo "🗑️  Удаляю образ: $IMAGE_ID"
            yc container image delete $IMAGE_ID --async || echo "⚠️  Не удалось удалить $IMAGE_ID"
          done
          
          echo "✅ Очистка Frontend завершена"

      - name: Summary
        run: |
          echo " Очистка Docker образов завершена!"
          echo "📦 Оставлено по ${{ env.KEEP_IMAGES_COUNT }} последних образов для Backend и Frontend"