name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  BACKEND_DIR: backend/recipe-service
  FRONTEND_DIR: frontend/recipe

jobs:
  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run backend tests
        run: mvn test
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  backend-build:
    name: Backend - Build
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build backend
        run: mvn clean package -DskipTests
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ${{ env.BACKEND_DIR }}/target/*.jar
          retention-days: 1

  frontend-test:
    name: Frontend - Test
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ${{ env.FRONTEND_DIR }}/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: Run frontend tests
        run: npm run test -- --run
        working-directory: ${{ env.FRONTEND_DIR }}

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ${{ env.FRONTEND_DIR }}/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: Type check
        run: npm run type-check
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: Build frontend
        run: npm run build-only
        working-directory: ${{ env.FRONTEND_DIR }}

  docker-push-backend:
    name: Docker push backend
    needs: frontend-build
    uses: ./.github/workflows/docker-push.yml
    with:
      service-name: recipe-backend
      dockerfile-path: backend/recipe-service/Dockerfile
      context-path: backend/recipe-service
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  docker-push-frontend:
    name: Docker push frontend
    needs: docker-push-backend
    uses: ./.github/workflows/docker-push.yml
    with:
      service-name: recipe-frontend
      dockerfile-path: frontend/recipe/Dockerfile
      context-path: frontend/recipe
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'