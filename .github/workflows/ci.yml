name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  BACKEND_DIR: backend/recipe-service
  FRONTEND_DIR: frontend/recipe
  YC_REGISTRY_ID: crpogsfdi7ukhk7uooeg

jobs:
  # ЭТАП 1: Тесты Backend
  backend-test:
    uses: ./.github/workflows/backend-test.yml

  # ЭТАП 2: Сборка Backend
  backend-build:
    needs: backend-test
    uses: ./.github/workflows/backend-build.yml

  # ЭТАП 3: Тесты Frontend
  frontend-test:
    needs: backend-build
    uses: ./.github/workflows/frontend-test.yml

  # ЭТАП 4: Сборка Frontend
  frontend-build:
    needs: frontend-test
    uses: ./.github/workflows/frontend-build.yml

  # ЭТАП 5: SonarQube
  sonarqube-scan:
    needs: frontend-build
    uses: ./.github/workflows/sonarqube-scan.yml
    secrets: inherit

  # ЭТАП 6: Docker Backend
  docker-backend:
    needs: sonarqube-scan
    uses: ./.github/workflows/docker-backend.yml
    secrets: inherit

  # ЭТАП 7: Docker Frontend
  docker-frontend:
    needs: docker-backend
    uses: ./.github/workflows/docker-frontend.yml
    secrets: inherit

  # Этап 8: Обновление манифестов
  update-manifests:
    needs: docker-frontend
    uses: ./.github/workflows/update-manifest.yml
    secrets: inherit

  notify-all:
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - backend-build
      - frontend-test
      - frontend-build
      - sonarqube-scan
      - docker-backend
      - docker-frontend
      - update-manifests
    if: always()
    steps:
      - name: Collect statuses and send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUSES=""

          add_status() {
            local name="$1"
            local result="$2"
            if [ "$result" = "success" ]; then
              STATUSES="${STATUSES}✅ ${name}\n"
            elif [ "$result" = "failure" ]; then
              STATUSES="${STATUSES}❌ ${name}\n"
            elif [ "$result" = "cancelled" ]; then
              STATUSES="${STATUSES}⏹️ ${name}\n"
            else
              STATUSES="${STATUSES}❓ ${name}\n"
            fi
          }

          add_status "Backend Tests" "${{ needs.backend-test.result }}"
          add_status "Backend Build" "${{ needs.backend-build.result }}"
          add_status "Frontend Tests" "${{ needs.frontend-test.result }}"
          add_status "Frontend Build" "${{ needs.frontend-build.result }}"
          add_status "SonarQube Scan" "${{ needs.sonarqube-scan.result }}"
          add_status "Docker Backend" "${{ needs.docker-backend.result }}"
          add_status "Docker Frontend" "${{ needs.docker-frontend.result }}"
          add_status "Update Manifests" "${{ needs.update-manifests.result }}"

          if echo "$STATUSES" | grep -q "❌"; then
            FINAL_STATUS="❌ PIPELINE FAILED"
          else
            FINAL_STATUS="✅ PIPELINE SUCCESS"
          fi

          MESSAGE="*${FINAL_STATUS}*

          📦 Repository: ${{ github.repository }}
          🏷️ Branch: ${{ github.ref_name }}
          📝 Commit: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          👤 Author: ${{ github.actor }}

          *📊 Stages:*
          ${STATUSES}

          🔗 [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"