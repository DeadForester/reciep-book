apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: recipe
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: deadforester/recipe-book-backend:latest
        env:
        - name: SPRING_DATA_MONGODB_URI
          value: "mongodb://admin:admin@mongo:27017/recipe_db?authSource=admin"
        - name: APP_MINIO_URL
          value: "http://minio:9000"
        - name: APP_MINIO_ACCESS_KEY
          value: "bestuser"
        - name: APP_MINIO_SECRET_KEY
          value: "bestuser"
        - name: APP_IMAGE_PROXY_PATH
          value: "/images/"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: recipe
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
